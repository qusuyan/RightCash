[package]
name = "right_cash-benchmark"
version = "0.1.0"
edition = "2024"
description = "firewood-style workloads (create, tenkrandom, zipf, single) against right_cash and bare storage engines (design §11)"

[features]
default = ["firewood"]
# Vanilla firewood as a target (design §11 baseline, R13).
firewood = ["right_cash/firewood"]
ethhash = ["right_cash/ethhash"]

[dependencies]
right_cash = { path = ".." }
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
rand = "0.10"
rand_distr = "0.6"
