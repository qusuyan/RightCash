[workspace]
members = [".", "benchmark"]

[package]
name = "auth_wal"
version = "0.1.0"
edition = "2024"
description = "Authenticated, bounded, in-memory set of recent writes between EVM validators and an authenticated storage engine"

[lib]
# rlib for Rust consumers (benchmark, tests); staticlib for the C ABI / Go `ffi`
# package, exactly as qmdb-ffi is linked.
crate-type = ["rlib", "staticlib"]

[features]
ffi = []
# Firewood storage backend (design §10), the engine of record; path dependency on ../firewood.
firewood = ["dep:firewood", "dep:firewood-storage"]
# Ethereum node hashing for the firewood backend (what the Avalanche adapter uses).
ethhash = ["firewood?/ethhash"]

[dependencies]
im = "15"
sha2 = "0.10"
blake3 = "1"
chacha20 = "0.10"
parking_lot = "0.12"
thiserror = "2"
log = "0.4"
firewood = { path = "../firewood/firewood", optional = true }
firewood-storage = { path = "../firewood/storage", optional = true }

[dev-dependencies]
criterion = "0.8"
rayon = "1"

[[bench]]
name = "lattice"
harness = false

[profile.release]
# Must stay "unwind": the C ABI converts panics into errors (see qmdb-ffi docs/01).
panic = "unwind"
