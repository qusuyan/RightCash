[workspace]
members = [".", "benchmark"]

[package]
name = "auth_wal"
version = "0.1.0"
edition = "2024"
description = "Authenticated, bounded, in-memory set of recent writes between EVM validators and an authenticated storage engine"

[features]
# Firewood storage backend (design §10), the engine of record; path dependency on ../firewood.
firewood = ["dep:firewood", "dep:firewood-storage"]
# Ethereum node hashing for the firewood backend (what the Avalanche adapter uses).
# Select Ethereum mode when opening Firewood; upstream supports both modes.
ethhash = []

[dependencies]
im = "15"
sha2 = "0.10"
blake3 = "1"
chacha20 = "0.10"
parking_lot = "0.12"
thiserror = "2"
log = "0.4"
tempfile = "3"
firewood = { path = "../firewood/firewood", optional = true }
firewood-storage = { path = "../firewood/storage", optional = true }

[profile.release]
# Must stay "unwind" (the default): the worker catches a step's panic
# (`speculate.rs`, `worker_panics`), and the C ABI of milestone 4 converts
# panics into errors, as qmdb-ffi's does.
panic = "unwind"
